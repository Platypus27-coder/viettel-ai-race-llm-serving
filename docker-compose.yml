services:
  model:
    image: vllm/vllm-openai:v0.22.1

    entrypoint:
      - python3                             # DO NOT CHANGE
      - -m                                  # DO NOT CHANGE
      - vllm.entrypoints.openai.api_server  # DO NOT CHANGE

    command:
      # ---- Core (DO NOT CHANGE) ----
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=1

      # ---- Memory & Cache ----
      - --max-model-len=8192
      - --gpu-memory-utilization=0.97

      # ---- Quantization ----
      - --quantization=fp8
      - --kv-cache-dtype=fp8_e4m3

      # ---- Caching ----
      - --enable-prefix-caching
      - --max-num-batched-tokens=1536

    ports:
      - "8000:8000"
    shm_size: "4g"

    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
      - VLLM_LOGGING_LEVEL=WARNING

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
