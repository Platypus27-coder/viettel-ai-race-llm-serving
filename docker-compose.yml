# ============================================================
# Viettel AI Race 2026 — SUBMISSION FILE
# ============================================================
# Model: LiquidAI/LFM2.5-1.2B-Instruct
# GPU: 1x MiG H200 (18GB VRAM, 3 CPU cores, 8GB RAM)
# Framework: vLLM v0.22.1
#
# PROFILE: v7.0 — Ultimate Hardware & Attention Engine Tuning
#
# Score History:
#   S02:  60.02  — Baseline BF16
#   v5.0: 61.15  — FP8 Weights
#   v6.0: 61.41  — FP8 Weights + FP8 KV Cache E4M3 (TTFT=45ms)
#   v7.0: Target 70-75+ — + Block Size 32 + FlashAttn Backend + Stream Fix
#
# Technical Levers in v7.0:
# 1. --block-size=32:
#    Default 16 forces GPU to manage ~15,000 memory blocks for 70 concurrent seqs.
#    Block size 32 cuts paging overhead by 50%, improves L2 cache hit rate during decode.
# 2. CUDA_DEVICE_MAX_CONNECTIONS=1:
#    Eliminates stream contention between API server and CUDA kernel launches.
# 3. VLLM_ATTENTION_BACKEND=FLASH_ATTN:
#    Forces high-efficiency FlashAttention-2 kernels for H200.
# ============================================================

services:
  model:
    image: vllm/vllm-openai:v0.22.1

    entrypoint:
      - python3                             # DO NOT CHANGE
      - -m                                  # DO NOT CHANGE
      - vllm.entrypoints.openai.api_server  # DO NOT CHANGE

    command:
      # ---- Core (DO NOT CHANGE) ----
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=1

      # ---- Memory & PagedAttention ----
      - --max-model-len=8192
      - --gpu-memory-utilization=0.97
      # Block size 32 (default 16): reduces PagedAttention lookup overhead by 50%
      # for 70 long-context sequences, boosting L2 cache hit rate.
      - --block-size=32

      # ---- Quantization ----
      - --quantization=fp8
      - --kv-cache-dtype=fp8_e4m3

      # ---- Caching ----
      - --enable-prefix-caching

    ports:
      - "8000:8000"
    shm_size: "4g"

    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=1
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
      - VLLM_LOGGING_LEVEL=WARNING

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
