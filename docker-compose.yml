# ============================================================
# Viettel AI Race 2026 — SUBMISSION FILE
# ============================================================
# Model: LiquidAI/LFM2.5-1.2B-Instruct
# GPU: 1x MiG H200 (18GB VRAM, 3 CPU cores, 8GB RAM)
# Framework: vLLM v0.22.1
#
# PROFILE: v8.1 — Validated Supported CLI Optimization Flags
#
# Fixes: Removed --num-scheduler-steps (unsupported by CLI entrypoint).
# Added BTC-supported flags:
# 1. --async-scheduling: Asynchronous scheduling loop to reduce CPU overhead.
# 2. --performance-mode=interactivity: Optimizes scheduler for lowest TPOT/TTFT.
# 3. --max-model-len=5120: Fits peak workload (4700), frees VRAM.
# 4. --max-num-seqs=48: Caps concurrent decode to prevent memory bandwidth saturation.
# ============================================================

services:
  model:
    image: vllm/vllm-openai:v0.22.1

    entrypoint:
      - python3                             # DO NOT CHANGE
      - -m                                  # DO NOT CHANGE
      - vllm.entrypoints.openai.api_server  # DO NOT CHANGE

    command:
      # ---- Core (DO NOT CHANGE) ----
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=1

      # ---- Memory & Performance ----
      - --max-model-len=5120
      - --gpu-memory-utilization=0.97
      - --max-num-seqs=48

      # ---- Scheduling & Interactivity (Supported CLI flags) ----
      - --async-scheduling
      - --performance-mode=interactivity

      # ---- Quantization ----
      - --quantization=fp8
      - --kv-cache-dtype=fp8_e4m3

      # ---- Caching ----
      - --enable-prefix-caching

    ports:
      - "8000:8000"
    shm_size: "4g"

    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=1
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
      - VLLM_LOGGING_LEVEL=WARNING

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
