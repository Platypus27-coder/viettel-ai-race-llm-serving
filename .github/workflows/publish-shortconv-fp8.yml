name: Publish and pin ShortConv FP8 Docker Hub image

# The contest requires the custom serving image to be in a public Docker Hub
# repository. Run this manually after adding the DOCKERHUB_TOKEN repository
# secret; it then verifies anonymous pull access before changing the root
# submission artifact.
on:
  workflow_dispatch:
    inputs:
      dockerhub_namespace:
        description: Docker Hub username or organization that owns viettel-ai-vllm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-shortconv-fp8-dockerhub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require Docker Hub access token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Set repository secret DOCKERHUB_TOKEN to a Docker Hub access token, then rerun." >&2
            exit 1
          fi

      - name: Resolve Docker Hub image name
        id: image
        env:
          NAMESPACE: ${{ inputs.dockerhub_namespace }}
        shell: bash
        run: |
          set -euo pipefail
          namespace="${NAMESPACE,,}"
          if ! [[ "$namespace" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "Docker Hub namespace is invalid: $NAMESPACE" >&2
            exit 1
          fi
          echo "name=${namespace}/viettel-ai-vllm" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ inputs.dockerhub_namespace }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish ShortConv FP8 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: BAKE_DRAFT_MODEL=0
          tags: |
            ${{ steps.image.outputs.name }}:shortconv-fp8
            ${{ steps.image.outputs.name }}:shortconv-fp8-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish build result
        run: |
          {
            echo "## ShortConv FP8 Docker Hub image"
            echo "\`${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-public-pull:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require anonymous Docker Hub manifest access
        env:
          IMAGE: ${{ needs.build.outputs.image_name }}
          DIGEST: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${IMAGE}:pull" \
            | jq -r '.token // .access_token // empty')"
          if [ -z "$token" ]; then
            echo "Docker Hub did not issue an anonymous pull token for ${IMAGE}." >&2
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://registry-1.docker.io/v2/${IMAGE}/manifests/${DIGEST}")"
          if [ "$status" != 200 ]; then
            echo "${IMAGE}@${DIGEST} is not anonymously pullable (HTTP ${status})." >&2
            echo "Make the Docker Hub repository public, then rerun this workflow." >&2
            exit 1
          fi

  pin-compose:
    needs: [build, verify-public-pull]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Render the exact portal Compose
        env:
          IMAGE: ${{ needs.build.outputs.image_name }}@${{ needs.build.outputs.digest }}
        run: |
          python3 scripts/select_submission.py \
            --candidate shortconv-fp8 \
            --custom-image "$IMAGE" \
            --output docker-compose.yml \
            --promote
          docker compose -f docker-compose.yml config --quiet

      - name: Commit digest-pinned Compose when it changed
        run: |
          if git diff --quiet -- docker-compose.yml; then
            echo "Root Compose already points at this image digest."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git commit -m "chore: pin shortconv-fp8 Docker Hub digest"
          git push origin HEAD:main
