name: Publish and pin ShortConv FP8 image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/publish-shortconv-fp8.yml

# The build uses GitHub's short-lived token: no Docker Hub credential or local
# Docker daemon is required. The package is linked to this repository through
# the OCI source label set below.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-shortconv-fp8-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve immutable GHCR name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/viettel-ai-vllm"
          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ShortConv FP8 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: BAKE_DRAFT_MODEL=0
          tags: |
            ${{ steps.image.outputs.name }}:shortconv-fp8
            ${{ steps.image.outputs.name }}:shortconv-fp8-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish build result
        run: |
          {
            echo "## ShortConv FP8 image"
            echo "\`${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-public-pull:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require anonymous GHCR manifest access
        env:
          IMAGE: ${{ needs.build.outputs.image_name }}
          DIGEST: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          repository="${IMAGE#ghcr.io/}"
          token="$(curl --fail --silent --show-error \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
            | jq -r '.token // .access_token // empty')"
          if [ -z "$token" ]; then
            echo "GHCR did not issue an anonymous pull token for ${IMAGE}." >&2
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repository}/manifests/${DIGEST}")"
          if [ "$status" != 200 ]; then
            echo "${IMAGE}@${DIGEST} is not anonymously pullable (HTTP ${status})." >&2
            echo "Make the GHCR package public in its Package settings, then rerun this workflow." >&2
            exit 1
          fi

  pin-compose:
    needs: [build, verify-public-pull]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Render the exact portal Compose
        env:
          IMAGE: ${{ needs.build.outputs.image_name }}@${{ needs.build.outputs.digest }}
        run: |
          python3 scripts/select_submission.py \
            --candidate shortconv-fp8 \
            --custom-image "$IMAGE" \
            --output docker-compose.yml \
            --promote
          docker compose -f docker-compose.yml config --quiet

      - name: Commit digest-pinned Compose when it changed
        run: |
          if git diff --quiet -- docker-compose.yml; then
            echo "Root Compose already points at this image digest."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git commit -m "chore: pin shortconv-fp8 image digest"
          git push origin HEAD:main
